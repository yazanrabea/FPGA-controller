# EXP-08 follow-up (2026-10-26, Rahaf): what Dima's sel[23:8] holds right after a rst_sipo
# pulse (his Q1), on the virtual chip (vchip_top).
#   SIPO load (the frame) -> rst_sipo pulse (no new load, no phirst) -> PISO read.
# The reset clears both sipo copies (frame = 0, sel[7:0] = frame[7:0] = 0). sipo_wrapper's
# `sel[23:8] <= parallel_out[23:8]` in the reset branch:
#   - simulation of Dima's RTL: reads parallel_out before it clears -> the previous frame's
#     slice 0 = frame[23:8] = 0xC3E7 -> piso_out = 0x000...0_C3E700C6 (CLAUDE.md §5 Q1);
#   - FPGA (Vivado built it from latches gated by rst_n): to be measured (maybe 0000).
# Not a chip test: it shows how Dima's RTL as written behaves in simulation vs in hardware.
#
# Board:  cd tools && python -m nemo_ctl.cli seq load ../config/exp08_sel_reset.yaml --jtag
# Sim:    scripts/run_vchip_sim.sh config/exp08_sel_reset.yaml 0x0000000000000000000000000000000000C3E700C6

target: chip_top

steps:
  - name: idle                 # step 0: every cell (as chip_sim_test.yaml)
    set:
      clk:       {type: LOW}
      reset:     {type: HIGH}
      set:       {type: LOW}
      rst_dsa:   {type: LOW}
      pulse:     {type: LOW}
      s0_p:      {type: LOW}
      s1_p:      {type: LOW}
      s2_p:      {type: LOW}
      b0_dft:    {type: LOW}
      b1_dft:    {type: LOW}
      b2_dft:    {type: LOW}
      s0_dft:    {type: LOW}
      s1_dft:    {type: LOW}
      s2_dft:    {type: LOW}
      s3_dft:    {type: LOW}
      sipo_in:   {type: LOW}
      clk_sipo:  {type: LOW}
      cs:        {type: LOW}
      rst_sipo:  {type: HIGH}  # active-low (sipo.sv rst_n), held inactive
      clk_piso:  {type: LOW}
      shift:     {type: LOW}
      rst_piso:  {type: HIGH}  # active-low (piso.sv rst_n), held inactive
    capture:
      sipo_out:  {mode: LEVEL}
      piso_out:  {mode: SERIAL, bits: 168, msb_first: true}
      dft0_buff: {mode: PERIOD}
      dft1_buff: {mode: PERIOD}
    until: {after: 5us}

  - name: sipo_load            # as chip_sim_test.yaml
    set:
      clk_sipo:  {type: CLOCK, freq: 1MHz, duty: 50%, cycles: 136, delay: 2us}
      sipo_in:   {type: SERIAL, data: "0x5AA55A0FF0123456789ABCDEF0C3C3E7E7", bits: 136, msb_first: true,
                  clock: clk_sipo, data_edge: falling, delay: 1us}
      cs:        {type: PULSE, width: 1us, delay: 140us}
    until: {after: 145us}

  - name: sipo_reset           # the question: what is sel[23:8] after this?
    set:
      rst_sipo:  {type: PULSE, width: 1us, delay: 1us, polarity: active_low}
    until: {after: 5us}

  - name: piso_read            # as chip_sim_test.yaml
    set:
      clk_piso:  {type: CLOCK, freq: 1MHz, duty: 50%, cycles: 168, delay: 2us}
      shift:     {type: PULSE, width: 170us, delay: 2700ns}
    capture:
      piso_out:  {mode: SERIAL, bits: 168, msb_first: true}
    until: {captured: piso_out, timeout: 300us}
